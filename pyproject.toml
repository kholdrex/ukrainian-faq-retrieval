[project]
name = "uafaq"
version = "1.0.0"
description = "Lexical, dense, hybrid and LLM-expanded retrieval for Ukrainian FAQ answers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Kholodniak", email = "o.o.kholodniak@khai.edu" }]
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uafaq = "uafaq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
